<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>库存占用 Treemap</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="../common/dashboard.css">
<style>
  body { padding: 20px; }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 {
    font-size: 28px;
    background: linear-gradient(90deg, #00d4ff, #a855f7, #ff6b35);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
  }
  .header .sub { font-size: 12px; color: #4a90e2; letter-spacing: 6px; margin-top: 4px; }
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    max-width: 1600px;
    margin: 0 auto 20px;
  }
  .kpi-card {
    background: linear-gradient(135deg, rgba(22,33,62,0.9), rgba(15,25,50,0.95));
    border: 1px solid rgba(168,85,247,0.4);
    border-radius: 8px; padding: 16px; text-align: center;
    position: relative; overflow: hidden;
  }
  .kpi-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(45deg, transparent 30%, rgba(168,85,247,0.1) 50%, transparent 70%);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .kpi-label { font-size: 12px; color: #8aa0c0; margin-bottom: 4px; }
  .kpi-value {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(90deg, #00d4ff, #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-family: 'Courier New', monospace;
  }
  .kpi-unit { font-size: 12px; color: #a855f7; -webkit-text-fill-color: #a855f7; }
  .chart-container {
    max-width: 1600px;
    margin: 0 auto;
    background: linear-gradient(135deg, rgba(22,33,62,0.9), rgba(15,25,50,0.95));
    border: 1px solid rgba(74,144,226,0.3);
    border-radius: 12px;
    padding: 20px;
    position: relative;
  }
  .chart { width: 100%; height: 700px; }
  .legend-info {
    position: absolute; top: 30px; right: 30px;
    background: rgba(10,20,40,0.8); border-radius: 6px;
    padding: 12px 16px; font-size: 12px; color: #fff;
    border: 1px solid rgba(74,144,226,0.3);
  }
  .legend-info h4 { color: #00d4ff; margin-bottom: 8px; font-size: 13px; }
  .legend-info .item { display: flex; align-items: center; margin: 4px 0; }
  .legend-info .dot { width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; }
</style>
</head>
<body>
<div class="header">
  <h1>库存占用分析</h1>
  <div class="sub">INVENTORY OCCUPANCY · TREEMAP VIEW</div>
</div>

<div class="kpi-row">
  <div class="kpi-card">
    <div class="kpi-label">总库存金额</div>
    <div class="kpi-value">2850<span class="kpi-unit">万</span></div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">SKU 总数</div>
    <div class="kpi-value">1286</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">活跃 SKU</div>
    <div class="kpi-value">1080<span class="kpi-unit"> (84%)</span></div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">呆滞库存</div>
    <div class="kpi-value">180<span class="kpi-unit">万 (6.3%)</span></div>
  </div>
</div>

<div class="chart-container">
  <div class="legend-info">
    <h4>图例</h4>
    <div class="item"><span class="dot" style="background:#10b981"></span>正常库存 (&lt;30天)</div>
    <div class="item"><span class="dot" style="background:#00d4ff"></span>周转中 (30-90天)</div>
    <div class="item"><span class="dot" style="background:#f59e0b"></span>滞销预警 (90-180天)</div>
    <div class="item"><span class="dot" style="background:#ef4444"></span>呆滞 (&gt;180天)</div>
  </div>
  <div class="chart" id="treemap"></div>
</div>

<script>
const treeData = {
  name: '总库存',
  value: 2850,
  children: [
    {
      name: 'A 仓库',
      value: 920,
      children: [
        {
          name: '电子产品',
          value: 480,
          children: [
            { name: '手机', value: 220, days: 45, status: 'normal' },
            { name: '电脑', value: 160, days: 60, status: 'turnover' },
            { name: '配件', value: 100, days: 30, status: 'normal' }
          ]
        },
        {
          name: '服装鞋帽',
          value: 440,
          children: [
            { name: '男装', value: 200, days: 75, status: 'turnover' },
            { name: '女装', value: 180, days: 120, status: 'warning' },
            { name: '鞋类', value: 60, days: 90, status: 'turnover' }
          ]
        }
      ]
    },
    {
      name: 'B 仓库',
      value: 1180,
      children: [
        {
          name: '家电',
          value: 580,
          children: [
            { name: '大家电', value: 320, days: 50, status: 'normal' },
            { name: '小家电', value: 180, days: 35, status: 'normal' },
            { name: '厨电', value: 80, days: 200, status: 'stagnant' }
          ]
        },
        {
          name: '日用百货',
          value: 600,
          children: [
            { name: '家居', value: 280, days: 40, status: 'normal' },
            { name: '美妆', value: 220, days: 25, status: 'normal' },
            { name: '清洁', value: 100, days: 150, status: 'warning' }
          ]
        }
      ]
    },
    {
      name: 'C 仓库',
      value: 750,
      children: [
        {
          name: '食品饮料',
          value: 380,
          children: [
            { name: '零食', value: 180, days: 20, status: 'normal' },
            { name: '饮料', value: 140, days: 15, status: 'normal' },
            { name: '生鲜', value: 60, days: 5, status: 'normal' }
          ]
        },
        {
          name: '图书文具',
          value: 370,
          children: [
            { name: '图书', value: 220, days: 220, status: 'stagnant' },
            { name: '文具', value: 100, days: 80, status: 'turnover' },
            { name: '办公', value: 50, days: 40, status: 'normal' }
          ]
        }
      ]
    }
  ]
};

// 状态 → 颜色映射
const statusColor = {
  'normal': '#10b981',     // 绿色 - 正常
  'turnover': '#00d4ff',   // 青色 - 周转
  'warning': '#f59e0b',    // 橙色 - 警告
  'stagnant': '#ef4444'    // 红色 - 呆滞
};
const statusName = {
  'normal': '正常',
  'turnover': '周转',
  'warning': '预警',
  'stagnant': '呆滞'
};

const chart = echarts.init(document.getElementById('treemap'), null, { renderer: 'canvas' });

chart.setOption({
  backgroundColor: 'transparent',
  tooltip: {
    formatter: function(info) {
      const data = info.data;
      if (!data) return info.name;
      const path = info.treePathInfo.map(p => p.name).join(' / ');
      const status = data.status ? statusName[data.status] : '';
      return `<div style="font-size:13px;">
        <b>${info.name}</b><br/>
        路径: ${path}<br/>
        库存金额: <b style="color:#00d4ff">${data.value}万</b><br/>
        ${data.days !== undefined ? `库龄: ${data.days}天<br/>状态: <b style="color:${statusColor[data.status]}">${status}</b>` : ''}
      </div>`;
    }
  },
  series: [{
    type: 'treemap',
    data: [treeData],
    roam: false,
    nodeClick: false,
    width: '100%',
    height: '100%',
    breadcrumb: {
      show: false  // 关闭面包屑，保持简洁
    },
    label: {
      show: true,
      formatter: function(params) {
        const d = params.data;
        const path = params.treePathInfo;
        // 叶子节点显示名称+数值
        if (!d.children) {
          return `{name|${params.name}}\n{value|${d.value}万}`;
        }
        // 中间节点显示名称
        return `{name|${params.name}}\n{value|${d.value}万}`;
      },
      rich: {
        name: {
          color: '#fff',
          fontSize: 13,
          fontWeight: 'bold',
          textShadowColor: '#000',
          textShadowBlur: 4
        },
        value: {
          color: 'rgba(255,255,255,0.8)',
          fontSize: 11,
          fontFamily: 'Courier New'
        }
      }
    },
    upperLabel: {
      show: true,
      height: 30,
      color: '#fff',
      fontSize: 13,
      fontWeight: 'bold',
      textBorderColor: '#000',
      textBorderWidth: 2
    },
    itemStyle: {
      borderColor: '#0a1530',
      borderWidth: 2,
      gapWidth: 2
    },
    emphasis: {
      upperLabel: { show: true },
      label: { fontSize: 14 }
    },
    levels: [
      {
        // 根节点（总库存）
        itemStyle: {
          borderColor: '#00d4ff',
          borderWidth: 3,
          gapWidth: 8,
          color: '#1a2a4e'
        },
        upperLabel: { show: false },
        label: {
          color: '#fff',
          fontSize: 16,
          fontWeight: 'bold'
        }
      },
      {
        // 仓库级（A/B/C）
        itemStyle: {
          borderColor: '#a855f7',
          borderWidth: 2,
          gapWidth: 4,
          color: '#2d1b4e'
        },
        upperLabel: { show: true, height: 26, color: '#fff' },
        label: { color: '#fff', fontSize: 14 }
      },
      {
        // 品类级
        itemStyle: {
          borderColor: '#ff6b35',
          borderWidth: 1.5,
          gapWidth: 3,
          color: '#3d2b1e'
        },
        label: { color: '#fff', fontSize: 12 }
      },
      {
        // 叶子（具体商品）
        itemStyle: {
          borderColor: '#0a1530',
          borderWidth: 1,
          gapWidth: 1
        },
        label: {
          show: true,
          color: '#fff',
          fontSize: 11,
          textShadowColor: '#000',
          textShadowBlur: 3
        }
      }
    ],
    // 数据映射：value → 面积，color按状态着色（仅叶子）
    dataFilter: function(node) {
      // 只保留叶子节点（具体商品）按状态染色
      if (!node.children && node.data.status) {
        node.data.itemStyle = { color: statusColor[node.data.status] };
      }
      return node;
    }
  }]
});

// Resize
window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
