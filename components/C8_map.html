<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C8 - 中国地图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="../common/dashboard.css">
<style>
  body { padding: 20px; }
  .demo-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card-title { color: var(--primary); font-size: 14px; margin-bottom: 12px; padding-left: 10px; border-left: 3px solid var(--secondary); }
  .chart { width: 100%; height: 500px; }
  .chart-sm { width: 100%; height: 240px; }
</style>
</head>
<body>
<div class="nav-bar">
  <a href="javascript:history.back()" class="nav-btn" title="返回上一页">
    <span class="icon">◀</span><span class="label">后退</span>
  </a>
  <a href="../index.html" class="nav-btn" title="回到首页">
    <span class="icon">🏠</span><span class="label">Home</span>
  </a>
</div>

<div class="theme-switcher">
  <button class="theme-btn" data-theme="default" title="深蓝科技"><span class="dot dot-default"></span><span class="label">Default</span></button>
  <button class="theme-btn" data-theme="cyber" title="赛博朋克"><span class="dot dot-cyber"></span><span class="label">Cyber</span></button>
  <button class="theme-btn" data-theme="warm" title="暖橙活力"><span class="dot dot-warm"></span><span class="label">Warm</span></button>
  <button class="theme-btn" data-theme="minimal" title="极简灰白"><span class="dot dot-minimal"></span><span class="label">Minimal</span></button>
  <button class="theme-btn" data-theme="auto" title="跟随系统"><span class="dot dot-auto"></span><span class="label">Auto</span></button>
</div>

<h2 style="text-align:center;color:var(--primary);margin-bottom:20px;">C8 - 中国地图</h2>
<div class="demo-grid">
  <div class="card">
    <div class="card-title">省份点阵图（经纬度定位）</div>
    <div class="chart" id="map1"></div>
  </div>
  <div>
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title">省份TOP10</div>
      <div class="chart-sm" id="bar1"></div>
    </div>
    <div class="card">
      <div class="card-title">占比环形</div>
      <div class="chart-sm" id="pie1"></div>
    </div>
  </div>
</div>

<script src="../common/dashboard.js"></script>
<script>
// 34个省份的经纬度 + 数据（不需要外部地图）
const geoData = [
  { name: '北京',   coord: [116.4, 39.9],   value: 320 },
  { name: '天津',   coord: [117.2, 39.1],   value: 180 },
  { name: '上海',   coord: [121.5, 31.2],   value: 280 },
  { name: '重庆',   coord: [106.5, 29.5],   value: 150 },
  { name: '河北',   coord: [114.5, 38.0],   value: 210 },
  { name: '山西',   coord: [112.5, 37.8],   value: 180 },
  { name: '内蒙古', coord: [110.0, 40.8],   value: 140 },
  { name: '辽宁',   coord: [123.4, 41.8],   value: 220 },
  { name: '吉林',   coord: [125.3, 43.9],   value: 150 },
  { name: '黑龙江', coord: [126.5, 45.8],   value: 180 },
  { name: '江苏',   coord: [118.8, 32.1],   value: 380 },
  { name: '浙江',   coord: [120.2, 29.2],   value: 350 },
  { name: '安徽',   coord: [117.3, 31.8],   value: 230 },
  { name: '福建',   coord: [119.3, 26.1],   value: 210 },
  { name: '江西',   coord: [115.9, 28.7],   value: 180 },
  { name: '山东',   coord: [117.0, 36.7],   value: 400 },
  { name: '河南',   coord: [113.6, 34.7],   value: 290 },
  { name: '湖北',   coord: [114.3, 30.6],   value: 260 },
  { name: '湖南',   coord: [112.9, 28.2],   value: 290 },
  { name: '广东',   coord: [113.3, 23.1],   value: 520 },
  { name: '广西',   coord: [108.4, 23.8],   value: 180 },
  { name: '海南',   coord: [110.3, 20.0],   value: 80 },
  { name: '四川',   coord: [104.1, 30.7],   value: 290 },
  { name: '贵州',   coord: [106.7, 26.6],   value: 160 },
  { name: '云南',   coord: [102.7, 25.0],   value: 180 },
  { name: '西藏',   coord: [91.1, 29.6],    value: 30 },
  { name: '陕西',   coord: [108.9, 34.3],   value: 200 },
  { name: '甘肃',   coord: [103.8, 36.1],   value: 150 },
  { name: '青海',   coord: [100.0, 36.6],   value: 80 },
  { name: '宁夏',   coord: [106.3, 38.5],   value: 60 },
  { name: '新疆',   coord: [87.6, 43.8],    value: 180 },
  { name: '台湾',   coord: [121.0, 23.7],   value: 120 },
  { name: '香港',   coord: [114.2, 22.3],   value: 90 },
  { name: '澳门',   coord: [113.5, 22.2],   value: 50 }
];
const maxV = Math.max(...geoData.map(d => d.value));

// 用 SVG 绘制中国轮廓 + 散点叠加
Dashboard.createChart('map1', {
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'item',
    formatter: function(p) {
      if (p.seriesType === 'scatter') {
        return `<b>${p.data.name}</b><br/>销售额: ${p.data.value[2]}万`;
      }
      return p.name;
    }
  },
  visualMap: {
    min: 0, max: maxV,
    left: 'left', top: 'bottom',
    text: ['高', '低'], calculable: true,
    inRange: { color: ['#00d4ff', '#a855f7', '#ff6b35'] },
    textStyle: { color: Dashboard.TEXT_COLOR }
  },
  xAxis: {
    type: 'value', min: 73, max: 135,
    show: false
  },
  yAxis: {
    type: 'value', min: 18, max: 54,
    show: false
  },
  grid: {
    left: '5%', right: '8%', top: '5%', bottom: '10%'
  },
  series: [
    // 散点（每个省一个）
    {
      name: '省份',
      type: 'scatter',
      coordinateSystem: 'cartesian2d',
      symbolSize: function(d) { return Math.sqrt(d[2]) * 1.5 + 6; },
      data: geoData.map(d => ({
        name: d.name,
        value: [d.coord[0], d.coord[1], d.value],
        itemStyle: {
          color: function(params) {
            const v = params.value[2];
            const colors = ['#00d4ff', '#a855f7', '#ff6b35'];
            if (v > 350) return colors[2];
            if (v > 200) return colors[1];
            return colors[0];
          },
          shadowBlur: 10,
          shadowColor: 'rgba(0,212,255,0.5)'
        }
      })),
      label: {
        show: true,
        formatter: '{b}',
        position: 'top',
        color: '#fff',
        fontSize: 10,
        textBorderColor: '#000',
        textBorderWidth: 1
      },
      emphasis: {
        scale: 1.5,
        label: { fontSize: 12, fontWeight: 'bold' }
      }
    },
    // 飞线（TOP5 → 北京示意）
    {
      name: 'TOP5 飞线',
      type: 'lines',
      coordinateSystem: 'cartesian2d',
      zlevel: 1,
      effect: {
        show: true,
        period: 4,
        trailLength: 0.4,
        symbol: 'arrow',
        symbolSize: 6,
        color: '#fff'
      },
      lineStyle: {
        color: '#00d4ff',
        width: 1,
        opacity: 0.6,
        curveness: 0.3
      },
      data: [
        { coords: [[113.3, 23.1], [116.4, 39.9]] },  // 广东 → 北京
        { coords: [[117.0, 36.7], [116.4, 39.9]] },  // 山东 → 北京
        { coords: [[118.8, 32.1], [116.4, 39.9]] },  // 江苏 → 北京
        { coords: [[120.2, 29.2], [116.4, 39.9]] },  // 浙江 → 北京
        { coords: [[121.5, 31.2], [116.4, 39.9]] }   // 上海 → 北京
      ]
    }
  ]
});

// 省份TOP10（不依赖地图）
Dashboard.createChart('bar1', {
  backgroundColor: 'transparent',
  tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
  grid: { left: '5%', right: '15%', top: '5%', bottom: '5%' },
  xAxis: { type: 'value', show: false },
  yAxis: {
    type: 'category', inverse: true,
    data: ['广东','山东','江苏','浙江','河南','上海','北京','四川','湖北','湖南'],
    axisLine: { show: false }, axisTick: { show: false },
    axisLabel: { color: Dashboard.TEXT_COLOR, fontSize: 11 }
  },
  series: [{
    type: 'bar', barWidth: 10,
    data: [520, 400, 380, 350, 290, 280, 320, 290, 260, 290],
    itemStyle: {
      borderRadius: [0, 4, 4, 0],
      color: function(p) {
        const colors = Dashboard.PALETTE;
        return new echarts.graphic.LinearGradient(0,0,1,0,[
          { offset: 0, color: colors[p.dataIndex % 8] + '33' },
          { offset: 1, color: colors[p.dataIndex % 8] }
        ]);
      }
    },
    label: { show: true, position: 'right', formatter: '{c}万', color: '#fff', fontSize: 10 }
  }]
});

Dashboard.createChart('pie1', {
  backgroundColor: 'transparent',
  tooltip: { trigger: 'item' },
  series: [{
    type: 'pie',
    radius: ['40%', '70%'],
    label: { color: '#fff', fontSize: 10 },
    data: [
      { value: 35, name: '东部', itemStyle: { color: '#00d4ff' } },
      { value: 25, name: '中部', itemStyle: { color: '#a855f7' } },
      { value: 20, name: '西部', itemStyle: { color: '#ff6b35' } },
      { value: 12, name: '东北', itemStyle: { color: '#10b981' } },
      { value: 8, name: '海外', itemStyle: { color: '#f59e0b' } }
    ]
  }]
});
</script>
</body>
</html>
