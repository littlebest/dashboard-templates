<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C1 - KPI 数字卡</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="../common/dashboard.css">
<style>
  body { padding: 20px; }
  .demo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .kpi {
    background: linear-gradient(135deg, rgba(22,33,62,0.9), rgba(15,25,50,0.95));
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .kpi::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(45deg, transparent 30%, rgba(168,85,247,0.1) 50%, transparent 70%);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .kpi-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; position: relative; }
  .kpi-value {
    font-size: 36px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-family: 'Courier New', monospace;
    position: relative;
  }
  .kpi-unit { font-size: 14px; color: var(--secondary); margin-left: 4px; -webkit-text-fill-color: var(--secondary); }
  .kpi-trend {
    font-size: 12px;
    margin-top: 6px;
    position: relative;
  }
  .trend-up { color: var(--success); }
  .trend-down { color: var(--danger); }
  .mini-chart { height: 30px; margin-top: 8px; }
</style>
</head>
<body>
<div class="nav-bar">
  <a href="javascript:history.back()" class="nav-btn" title="返回上一页">
    <span class="icon">◀</span><span class="label">后退</span>
  </a>
  <a href="../index.html" class="nav-btn" title="回到首页">
    <span class="icon">🏠</span><span class="label">Home</span>
  </a>
</div>

<div class="theme-switcher">
  <button class="theme-btn" data-theme="default" title="深蓝科技"><span class="dot dot-default"></span><span class="label">Default</span></button>
  <button class="theme-btn" data-theme="cyber" title="赛博朋克"><span class="dot dot-cyber"></span><span class="label">Cyber</span></button>
  <button class="theme-btn" data-theme="warm" title="暖橙活力"><span class="dot dot-warm"></span><span class="label">Warm</span></button>
  <button class="theme-btn" data-theme="minimal" title="极简灰白"><span class="dot dot-minimal"></span><span class="label">Minimal</span></button>
  <button class="theme-btn" data-theme="auto" title="跟随系统"><span class="dot dot-auto"></span><span class="label">Auto</span></button>
</div>

<h2 style="text-align:center;color:var(--primary);margin-bottom:20px;">C1 - KPI 数字卡</h2>
<div class="demo-grid">
  <div class="kpi">
    <div class="kpi-label">总销售额</div>
    <div class="kpi-value">1286<span class="kpi-unit">万</span></div>
    <div class="kpi-trend trend-up">▲ 12.5% 同比</div>
    <div class="mini-chart" id="m1"></div>
  </div>
  <div class="kpi">
    <div class="kpi-label">订单数</div>
    <div class="kpi-value">3420<span class="kpi-unit">单</span></div>
    <div class="kpi-trend trend-up">▲ 8.2% 环比</div>
    <div class="mini-chart" id="m2"></div>
  </div>
  <div class="kpi">
    <div class="kpi-label">退货率</div>
    <div class="kpi-value">3.2<span class="kpi-unit">%</span></div>
    <div class="kpi-trend trend-down">▼ 0.5% 下降</div>
    <div class="mini-chart" id="m3"></div>
  </div>
  <div class="kpi">
    <div class="kpi-label">客户满意度</div>
    <div class="kpi-value">98.7<span class="kpi-unit">%</span></div>
    <div class="kpi-trend trend-up">▲ 1.3% 提升</div>
    <div class="mini-chart" id="m4"></div>
  </div>
</div>

<script src="../common/dashboard.js"></script>
<script>
// 4个迷你折线图
for (let i = 1; i <= 4; i++) {
  Dashboard.createChart('m'+i, {
    backgroundColor: 'transparent',
    grid: { left: 0, right: 0, top: 5, bottom: 0 },
    xAxis: { type: 'category', show: false, data: Array.from({length:12},(_,j)=>j) },
    yAxis: { type: 'value', show: false },
    series: [{
      type: 'line',
      data: Array.from({length:12},()=>Math.random()*100),
      smooth: true,
      symbol: 'none',
      lineStyle: { color: i%2===0 ? Dashboard.PALETTE[2] : Dashboard.PALETTE[0], width: 1.5 },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0,0,0,1,[
          {offset:0,color: (i%2===0 ? Dashboard.PALETTE[2] : Dashboard.PALETTE[0])+'66'},
          {offset:1,color:'transparent'}
        ])
      }
    }]
  });
}
</script>
</body>
</html>
