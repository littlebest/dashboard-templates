<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C4 - 漏斗图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="../common/dashboard.css">
<style>
  body { padding: 20px; }
  .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card-title { color: var(--primary); font-size: 14px; margin-bottom: 12px; padding-left: 10px; border-left: 3px solid var(--secondary); }
  .chart { width: 100%; height: 380px; }
</style>
</head>
<body>
<div class="nav-bar">
  <a href="javascript:history.back()" class="nav-btn" title="返回上一页">
    <span class="icon">◀</span><span class="label">后退</span>
  </a>
  <a href="../index.html" class="nav-btn" title="回到首页">
    <span class="icon">🏠</span><span class="label">Home</span>
  </a>
</div>

<div class="theme-switcher">
  <button class="theme-btn" data-theme="default" title="深蓝科技"><span class="dot dot-default"></span><span class="label">Default</span></button>
  <button class="theme-btn" data-theme="cyber" title="赛博朋克"><span class="dot dot-cyber"></span><span class="label">Cyber</span></button>
  <button class="theme-btn" data-theme="warm" title="暖橙活力"><span class="dot dot-warm"></span><span class="label">Warm</span></button>
  <button class="theme-btn" data-theme="minimal" title="极简灰白"><span class="dot dot-minimal"></span><span class="label">Minimal</span></button>
  <button class="theme-btn" data-theme="auto" title="跟随系统"><span class="dot dot-auto"></span><span class="label">Auto</span></button>
</div>

<h2 style="text-align:center;color:var(--primary);margin-bottom:20px;">C4 - 漏斗图</h2>
<div class="demo-grid">
  <div class="card">
    <div class="card-title">转化漏斗</div>
    <div class="chart" id="f1"></div>
  </div>
  <div class="card">
    <div class="card-title">销售漏斗（LTC）</div>
    <div class="chart" id="f2"></div>
  </div>
</div>

<script src="../common/dashboard.js"></script>
<script>
// 1. 转化漏斗
Dashboard.createChart('f1', {
  backgroundColor: 'transparent',
  tooltip: { trigger: 'item', formatter: '{b}: {c}%' },
  series: [{
    type: 'funnel',
    left: '10%', right: '10%', top: '5%', bottom: '5%',
    width: '80%',
    min: 0, max: 100,
    sort: 'descending', gap: 4,
    label: { show: true, position: 'inside', color: '#fff', fontSize: 14, fontWeight: 'bold' },
    itemStyle: { borderColor: '#0a1530', borderWidth: 2 },
    data: [
      { value: 100, name: '浏览商品 100%', itemStyle: { color: '#00d4ff' } },
      { value: 80, name: '加入购物车 80%', itemStyle: { color: '#06b6d4' } },
      { value: 60, name: '生成订单 60%', itemStyle: { color: '#a855f7' } },
      { value: 40, name: '支付订单 40%', itemStyle: { color: '#3b82f6' } },
      { value: 20, name: '完成购买 20%', itemStyle: { color: '#ff6b35' } }
    ]
  }]
});

// 2. 销售漏斗
Dashboard.createChart('f2', {
  backgroundColor: 'transparent',
  tooltip: { trigger: 'item', formatter: '{b}: {c}' },
  legend: { bottom: 0, textStyle: { color: Dashboard.TEXT_COLOR } },
  series: [{
    type: 'funnel',
    left: '10%', right: '10%', top: '5%', bottom: '15%',
    width: '80%',
    sort: 'descending', gap: 6,
    label: {
      show: true, position: 'inside', color: '#fff', fontSize: 13,
      formatter: '{b}: {c}'
    },
    itemStyle: { borderColor: '#0a1530', borderWidth: 2 },
    data: [
      { value: 5000, name: '线索', itemStyle: { color: '#00d4ff' } },
      { value: 3200, name: '商机', itemStyle: { color: '#06b6d4' } },
      { value: 1800, name: '报价', itemStyle: { color: '#a855f7' } },
      { value: 1200, name: '合同', itemStyle: { color: '#3b82f6' } },
      { value: 980, name: '成交', itemStyle: { color: '#10b981' } }
    ]
  }]
});
</script>
</body>
</html>
