<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C5 - 3D柱状图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
<link rel="stylesheet" href="../common/dashboard.css">
<style>
  body { padding: 20px; }
  .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card-title { color: var(--primary); font-size: 14px; margin-bottom: 12px; padding-left: 10px; border-left: 3px solid var(--secondary); }
  .chart { width: 100%; height: 380px; }
</style>
</head>
<body>
<div class="nav-bar">
  <a href="javascript:history.back()" class="nav-btn" title="返回上一页">
    <span class="icon">◀</span><span class="label">后退</span>
  </a>
  <a href="../index.html" class="nav-btn" title="回到首页">
    <span class="icon">🏠</span><span class="label">Home</span>
  </a>
</div>

<div class="theme-switcher">
  <button class="theme-btn" data-theme="default" title="深蓝科技"><span class="dot dot-default"></span><span class="label">Default</span></button>
  <button class="theme-btn" data-theme="cyber" title="赛博朋克"><span class="dot dot-cyber"></span><span class="label">Cyber</span></button>
  <button class="theme-btn" data-theme="warm" title="暖橙活力"><span class="dot dot-warm"></span><span class="label">Warm</span></button>
  <button class="theme-btn" data-theme="minimal" title="极简灰白"><span class="dot dot-minimal"></span><span class="label">Minimal</span></button>
  <button class="theme-btn" data-theme="auto" title="跟随系统"><span class="dot dot-auto"></span><span class="label">Auto</span></button>
</div>

<h2 style="text-align:center;color:var(--primary);margin-bottom:20px;">C5 - 3D柱状图</h2>
<div class="demo-grid">
  <div class="card">
    <div class="card-title">3D 柱状图（销量×品类×月份）</div>
    <div class="chart" id="c51"></div>
  </div>
  <div class="card">
    <div class="card-title">3D 堆积柱状（各品类6月销量）</div>
    <div class="chart" id="c52"></div>
  </div>
</div>

<script src="../common/dashboard.js"></script>
<script>
// 1. 3D柱状图
Dashboard.createChart('c51', {
  backgroundColor: 'transparent',
  tooltip: {},
  visualMap: {
    max: 30, min: 0, dimension: 2,
    inRange: { color: ['#00d4ff', '#a855f7', '#ff6b35'] },
    textStyle: { color: Dashboard.TEXT_COLOR },
    calculable: true,
    orient: 'vertical', right: 0, top: 'center'
  },
  xAxis3D: { type: 'category', data: ['1月','2月','3月','4月','5月','6月'], axisLabel: { color: Dashboard.TEXT_COLOR } },
  yAxis3D: { type: 'category', data: ['手机','电脑','服装','食品'], axisLabel: { color: Dashboard.TEXT_COLOR } },
  zAxis3D: { type: 'value', axisLabel: { color: Dashboard.TEXT_COLOR } },
  grid3D: {
    boxWidth: 200, boxDepth: 120, viewControl: { projection: 'orthographic' },
    light: { main: { intensity: 1.2 }, ambient: { intensity: 0.3 } }
  },
  series: [{
    type: 'bar3D',
    data: [
      ['1月','手机',25],['1月','电脑',18],['1月','服装',12],['1月','食品',8],
      ['2月','手机',22],['2月','电脑',20],['2月','服装',15],['2月','食品',10],
      ['3月','手机',28],['3月','电脑',22],['3月','服装',18],['3月','食品',12],
      ['4月','手机',30],['4月','电脑',25],['4月','服装',20],['4月','食品',15],
      ['5月','手机',26],['5月','电脑',23],['5月','服装',22],['5月','食品',14],
      ['6月','手机',32],['6月','电脑',28],['6月','服装',25],['6月','食品',18]
    ].map(d => ({ value: [d[0], d[1], d[2]] })),
    shading: 'lambert',
    label: { show: false }
  }]
});

// 2. 3D堆积柱状（4个省份/品类叠加对比）
Dashboard.createChart('c52', {
  backgroundColor: 'transparent',
  tooltip: { trigger: 'item' },
  legend: { bottom: 0, textStyle: { color: Dashboard.TEXT_COLOR } },
  xAxis3D: {
    type: 'category',
    data: ['北京', '上海', '广州', '深圳'],
    axisLabel: { color: Dashboard.TEXT_COLOR, fontSize: 12 }
  },
  yAxis3D: {
    type: 'category',
    data: ['手机', '电脑', '服装', '食品', '家电'],
    axisLabel: { color: Dashboard.TEXT_COLOR, fontSize: 12 }
  },
  zAxis3D: { type: 'value', axisLabel: { color: Dashboard.TEXT_COLOR } },
  grid3D: {
    boxWidth: 120, boxDepth: 80,
    viewControl: { projection: 'orthographic', alpha: 25, beta: 25 },
    light: { main: { intensity: 1.2 }, ambient: { intensity: 0.4 } }
  },
  visualMap: {
    max: 100, min: 0,
    inRange: { color: ['#00d4ff', '#a855f7', '#ff6b35', '#10b981'] },
    textStyle: { color: Dashboard.TEXT_COLOR },
    calculable: true,
    orient: 'vertical', right: 0, top: 'center'
  },
  series: [
    // 北京
    { name: '北京', type: 'bar3D', stack: 'total',
      data: [['北京','手机',85],['北京','电脑',72],['北京','服装',45],['北京','食品',38],['北京','家电',62]].map(d => ({ value: d })),
      shading: 'lambert', label: { show: false } },
    // 上海
    { name: '上海', type: 'bar3D', stack: 'total',
      data: [['上海','手机',92],['上海','电脑',68],['上海','服装',58],['上海','食品',42],['上海','家电',55]].map(d => ({ value: d })),
      shading: 'lambert', label: { show: false } },
    // 广州
    { name: '广州', type: 'bar3D', stack: 'total',
      data: [['广州','手机',78],['广州','电脑',55],['广州','服装',62],['广州','食品',48],['广州','家电',50]].map(d => ({ value: d })),
      shading: 'lambert', label: { show: false } },
    // 深圳
    { name: '深圳', type: 'bar3D', stack: 'total',
      data: [['深圳','手机',88],['深圳','电脑',75],['深圳','服装',52],['深圳','食品',35],['深圳','家电',58]].map(d => ({ value: d })),
      shading: 'lambert', label: { show: false } }
  ]
});
</script>
</body>
</html>
