<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C10 - 状态图（4×5 方块单元 × 8）</title>
<link rel="stylesheet" href="../common/dashboard.css">
<style>
  body { padding: 20px; }
  .card-title {
    color: var(--primary);
    font-size: 14px;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 3px solid var(--secondary);
  }
  .demo-wrap {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 状态图容器：8 个单元并排 */
  .status-grid {
    display: grid;
    /* 8 单元，每单元 5 列；列数 = 8*5 = 40 列；单元间用 margin 留空 */
    grid-template-columns: repeat(40, 1fr);
    gap: 4px;
    padding: 16px;
  }

  /* 单个单元（4 层 × 5 列） */
  .cell {
    grid-column: span 5;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3px;
    aspect-ratio: 5 / 4;
  }
  /* 单元之间留 1 列空白 */
  .cell + .cell { margin-left: 4px; }

  /* 小方块 */
  .block {
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 2px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .block:hover {
    transform: scale(1.15);
    box-shadow: 0 0 6px var(--primary-glow);
    z-index: 2;
  }
  /* 三种状态颜色 */
  .block.busy   { background: #6b7280; border-color: #4b5563; }   /* 灰色 - 占用 */
  .block.done   { background: #10b981; border-color: #059669; box-shadow: 0 0 4px rgba(16,185,129,0.5); }
  .block.empty  { background: rgba(255,255,255,0.9); border-color: rgba(0,0,0,0.1); } /* 白色 - 空闲 */

  /* 状态汇总 */
  .summary {
    display: flex;
    gap: 20px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .summary .item {
    display: flex; align-items: center; gap: 6px;
  }
  .summary .sw {
    width: 14px; height: 14px;
    border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .summary .num {
    color: var(--primary);
    font-weight: 700;
    font-family: 'Courier New', monospace;
  }
</style>
</head>
<body>
<div class="nav-bar">
  <a href="javascript:history.back()" class="nav-btn" title="返回上一页">
    <span class="icon">◀</span><span class="label">后退</span>
  </a>
  <a href="../index.html" class="nav-btn" title="回到首页">
    <span class="icon">🏠</span><span class="label">Home</span>
  </a>
</div>

<div class="theme-switcher">
  <button class="theme-btn" data-theme="default" title="深蓝科技"><span class="dot dot-default"></span><span class="label">Default</span></button>
  <button class="theme-btn" data-theme="cyber" title="赛博朋克"><span class="dot dot-cyber"></span><span class="label">Cyber</span></button>
  <button class="theme-btn" data-theme="warm" title="暖橙活力"><span class="dot dot-warm"></span><span class="label">Warm</span></button>
  <button class="theme-btn" data-theme="minimal" title="极简灰白"><span class="dot dot-minimal"></span><span class="label">Minimal</span></button>
  <button class="theme-btn" data-theme="auto" title="跟随系统"><span class="dot dot-auto"></span><span class="label">Auto</span></button>
</div>

<h2 style="text-align:center;color:var(--primary);margin-bottom:20px;">C10 - 状态图（4×5 单元 × 8 并排）</h2>

<div class="demo-wrap">
  <div class="card">
    <div class="card-title">作业状态（8 单元 × 20 方块 = 160 作业位）</div>
    <div class="status-grid" id="grid"></div>
    <div class="summary" id="summary"></div>
  </div>
</div>

<script src="../common/dashboard.js"></script>
<script>
// === 数据生成 ===
// 单元 1：连续 8 个灰 + 12 个白
// 单元 2：连续 12 个灰 + 8 个白
// 单元 3：全绿（20）
// 单元 4：全白（20）
// 单元 5：全绿（20）
// 单元 6：全白（20）
// 单元 7：全白（20）
// 单元 8：全白（20）
const states = [
  [...Array(8).fill('busy'),  ...Array(12).fill('empty')],   // 单元 1
  [...Array(12).fill('busy'), ...Array(8).fill('empty')],    // 单元 2
  Array(20).fill('done'),                                   // 单元 3
  Array(20).fill('empty'),                                  // 单元 4
  Array(20).fill('done'),                                   // 单元 5
  Array(20).fill('empty'),                                  // 单元 6
  Array(20).fill('empty'),                                  // 单元 7
  Array(20).fill('empty'),                                  // 单元 8
];

// === 构建状态图 ===
const grid = document.getElementById('grid');
const counts = { empty: 0, busy: 0, done: 0 };

states.forEach((cellStates, cellIdx) => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cellStates.forEach(state => {
    const b = document.createElement('div');
    b.className = 'block ' + state;
    counts[state] = (counts[state] || 0) + 1;
    cell.appendChild(b);
  });
  grid.appendChild(cell);
});

// === 汇总 ===
const s = document.getElementById('summary');
const total = counts.empty + counts.busy + counts.done;
s.innerHTML = `
  <div class="item"><span class="sw" style="background:rgba(255,255,255,0.9);"></span>空闲 <span class="num">${counts.empty}</span></div>
  <div class="item"><span class="sw" style="background:#6b7280;"></span>占用 <span class="num">${counts.busy}</span></div>
  <div class="item"><span class="sw" style="background:#10b981;"></span>完成 <span class="num">${counts.done}</span></div>
  <div class="item" style="margin-left:auto;">合计 <span class="num">${total}</span> 作业位</div>
`;
</script>
</body>
</html>
