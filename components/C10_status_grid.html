<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C10 - 状态图（4×5 方块单元 × 8）</title>
<link rel="stylesheet" href="../common/dashboard.css">
<style>
  body { padding: 20px; }
  .card-title {
    color: var(--primary);
    font-size: 14px;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 3px solid var(--secondary);
  }
  .demo-wrap {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 状态图容器：8 个单元并排 */
  .status-grid {
    display: grid;
    /* 8 单元，每单元 5 列 + 单元间 1 空列；列数 = 8*5 + 7 = 47 列 */
    grid-template-columns: repeat(47, 1fr);
    gap: 4px;
    padding: 16px;
  }

  /* 单个单元（4 层 × 5 列） */
  .cell {
    grid-column: span 5;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3px;
    aspect-ratio: 5 / 4;
  }
  /* 单元之间留 1 列空白：用 margin-right 在最后一列补偿，简化做法是第 N 个单元后插入 spacer */
  .cell + .cell { margin-left: 4px; }

  /* 小方块 */
  .block {
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 2px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .block:hover {
    transform: scale(1.15);
    box-shadow: 0 0 6px var(--primary-glow);
    z-index: 2;
  }
  /* 三种状态颜色 */
  .block.busy   { background: #6b7280; border-color: #4b5563; }   /* 灰色 - 占用 */
  .block.done   { background: #10b981; border-color: #059669; box-shadow: 0 0 4px rgba(16,185,129,0.5); }
  .block.empty  { background: rgba(255,255,255,0.9); border-color: rgba(0,0,0,0.1); } /* 白色 - 空闲 */

  /* 单元编号标签 */
  .cell-label {
    grid-column: span 5;
    text-align: center;
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
    font-family: 'Courier New', monospace;
  }

  /* 状态汇总 */
  .summary {
    display: flex;
    gap: 20px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .summary .item {
    display: flex; align-items: center; gap: 6px;
  }
  .summary .sw {
    width: 14px; height: 14px;
    border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .summary .num {
    color: var(--primary);
    font-weight: 700;
    font-family: 'Courier New', monospace;
  }

  /* 第二个 demo：车间实时刷新（动效版） */
  .controls {
    display: flex;
    gap: 10px;
    padding: 8px 16px;
    align-items: center;
  }
  .btn {
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid var(--primary);
    background: transparent;
    color: var(--primary);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover {
    background: var(--primary);
    color: #fff;
  }
  .flash {
    animation: flash 0.6s ease;
  }
  @keyframes flash {
    0% { box-shadow: 0 0 0 rgba(245,158,11,0); }
    50% { box-shadow: 0 0 10px rgba(245,158,11,0.9); }
    100% { box-shadow: 0 0 0 rgba(245,158,11,0); }
  }
</style>
</head>
<body>
<div class="nav-bar">
  <a href="javascript:history.back()" class="nav-btn" title="返回上一页">
    <span class="icon">◀</span><span class="label">后退</span>
  </a>
  <a href="../index.html" class="nav-btn" title="回到首页">
    <span class="icon">🏠</span><span class="label">Home</span>
  </a>
</div>

<div class="theme-switcher">
  <button class="theme-btn" data-theme="default" title="深蓝科技"><span class="dot dot-default"></span><span class="label">Default</span></button>
  <button class="theme-btn" data-theme="cyber" title="赛博朋克"><span class="dot dot-cyber"></span><span class="label">Cyber</span></button>
  <button class="theme-btn" data-theme="warm" title="暖橙活力"><span class="dot dot-warm"></span><span class="label">Warm</span></button>
  <button class="theme-btn" data-theme="minimal" title="极简灰白"><span class="dot dot-minimal"></span><span class="label">Minimal</span></button>
  <button class="theme-btn" data-theme="auto" title="跟随系统"><span class="dot dot-auto"></span><span class="label">Auto</span></button>
</div>

<h2 style="text-align:center;color:var(--primary);margin-bottom:20px;">C10 - 状态图（4×5 单元 × 8 并排）</h2>

<div class="demo-wrap">
  <!-- 示例 1：固定展示（生产线 A） -->
  <div class="card">
    <div class="card-title">① 车间 A · 工位状态（8 单元 × 20 方块 = 160 工位）</div>
    <div class="status-grid" id="grid1"></div>
    <div class="summary" id="summary1"></div>
  </div>

  <!-- 示例 2：实时刷新版（可点 Start 触发） -->
  <div class="card">
    <div class="card-title">② 车间 B · 实时刷新版</div>
    <div class="controls">
      <button class="btn" id="btnStart">▶ Start</button>
      <button class="btn" id="btnStop">■ Stop</button>
      <span style="font-size:11px;color:var(--text-secondary);">每 1.5s 刷新一次状态</span>
    </div>
    <div class="status-grid" id="grid2"></div>
    <div class="summary" id="summary2"></div>
  </div>
</div>

<script src="../common/dashboard.js"></script>
<script>
// === 通用：构建状态图 ===
// states: 二维数组，长度=8，每个元素长度=20（4×5）
function buildGrid(containerId, states, summaryId) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  const counts = { empty: 0, busy: 0, done: 0 };

  states.forEach((cellStates, cellIdx) => {
    const cell = document.createElement('div');
    cell.className = 'cell';

    cellStates.forEach(state => {
      const b = document.createElement('div');
      b.className = 'block ' + state;
      counts[state] = (counts[state] || 0) + 1;
      cell.appendChild(b);
    });

    grid.appendChild(cell);

    // 单元之间的分隔标签（可选）
    if (cellIdx < states.length - 1 && (cellIdx + 1) % 4 === 0) {
      // 每 4 单元换视觉行（通过额外 margin 控制间距已足够）
    }
  });

  // 汇总
  const s = document.getElementById(summaryId);
  if (s) {
    const total = counts.empty + counts.busy + counts.done;
    s.innerHTML = `
      <div class="item"><span class="sw" style="background:rgba(255,255,255,0.9);"></span>空闲 <span class="num">${counts.empty}</span></div>
      <div class="item"><span class="sw" style="background:#6b7280;"></span>占用 <span class="num">${counts.busy}</span></div>
      <div class="item"><span class="sw" style="background:#10b981;"></span>完成 <span class="num">${counts.done}</span></div>
      <div class="item" style="margin-left:auto;">合计 <span class="num">${total}</span> 工位</div>
    `;
  }
}

// === 数据生成 ===
// 固定演示数据（车间 A — 展示完整进度推进）
const fixedStates = [
  // 单元 0：全完成
  Array(20).fill('done'),
  // 单元 1：大多完成
  [...Array(16).fill('done'), ...Array(4).fill('busy')],
  // 单元 2：完成 + 占用
  [...Array(14).fill('done'), ...Array(3).fill('busy'), ...Array(3).fill('empty')],
  // 单元 3：半成品
  [...Array(11).fill('done'), ...Array(5).fill('busy'), ...Array(4).fill('empty')],
  // 单元 4：进行中
  [...Array(8).fill('done'), ...Array(8).fill('busy'), ...Array(4).fill('empty')],
  // 单元 5：刚开始
  [...Array(5).fill('done'), ...Array(10).fill('busy'), ...Array(5).fill('empty')],
  // 单元 6：刚启动
  [...Array(3).fill('done'), ...Array(8).fill('busy'), ...Array(9).fill('empty')],
  // 单元 7：全空（待开工）
  Array(20).fill('empty')
];

buildGrid('grid1', fixedStates, 'summary1');

// === 实时刷新版（车间 B） ===
function randStates() {
  return Array.from({ length: 8 }, () => {
    // 每单元 20 格，按概率分配：完成 30% / 占用 35% / 空闲 35%
    return Array.from({ length: 20 }, () => {
      const r = Math.random();
      if (r < 0.30) return 'done';
      if (r < 0.65) return 'busy';
      return 'empty';
    });
  });
}

buildGrid('grid2', randStates(), 'summary2');

let timer = null;
document.getElementById('btnStart').onclick = () => {
  if (timer) return;
  timer = setInterval(() => {
    const newStates = randStates();
    // 找变化的格子加 flash
    const grid = document.getElementById('grid2');
    const cells = grid.querySelectorAll('.cell');
    newStates.forEach((cellStates, i) => {
      const old = Array.from(cells[i].children).map(b => {
        if (b.classList.contains('done')) return 'done';
        if (b.classList.contains('busy')) return 'busy';
        return 'empty';
      });
      cellStates.forEach((s, j) => {
        if (old[j] !== s) {
          cells[i].children[j].classList.add('flash');
          setTimeout(() => cells[i].children[j].classList.remove('flash'), 600);
        }
        cells[i].children[j].className = 'block ' + s;
      });
    });
    // 更新汇总
    const counts = { empty: 0, busy: 0, done: 0 };
    newStates.forEach(cell => cell.forEach(s => counts[s]++));
    const s = document.getElementById('summary2');
    const total = counts.empty + counts.busy + counts.done;
    s.innerHTML = `
      <div class="item"><span class="sw" style="background:rgba(255,255,255,0.9);"></span>空闲 <span class="num">${counts.empty}</span></div>
      <div class="item"><span class="sw" style="background:#6b7280;"></span>占用 <span class="num">${counts.busy}</span></div>
      <div class="item"><span class="sw" style="background:#10b981;"></span>完成 <span class="num">${counts.done}</span></div>
      <div class="item" style="margin-left:auto;">合计 <span class="num">${total}</span> 工位</div>
    `;
  }, 1500);
};

document.getElementById('btnStop').onclick = () => {
  if (timer) { clearInterval(timer); timer = null; }
};
</script>
</body>
</html>
